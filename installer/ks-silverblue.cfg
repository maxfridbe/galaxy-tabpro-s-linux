# Partial kickstart: installs Fedora Silverblue 45 from the official OCI image.
# Everything NOT listed here (disk/partitioning, network/Wi-Fi, language,
# timezone) is left for you to pick in the installer — nothing is wiped
# until you choose a disk and click "Begin Installation".
# Needs a network connection during install (it pulls the image from quay.io).
ostreecontainer --url=quay.io/fedora/fedora-silverblue:45 --transport=registry --no-signature-verification

# After first boot, switch to the signed image so updates are verified:
#   rpm-ostree rebase ostree-image-signed:registry:quay.io/fedora/fedora-silverblue:45
