set default="0"

function load_video {
  insmod efi_gop
  insmod efi_uga
  insmod video_bochs
  insmod video_cirrus
  insmod all_video
}

load_video
set gfxpayload=keep
insmod gzio
insmod part_gpt
insmod part_msdos
insmod fat
insmod ext2

set timeout=30

# This stick is a plain FAT32 drive (not a dd'd ISO); find it by its FS UUID.
search --no-floppy --set=root --fs-uuid 0008-A438

menuentry 'Install Fedora Silverblue 45 (W700)' --class fedora --class gnu-linux --class gnu --class os {
	linux /images/pxeboot/vmlinuz inst.stage2=hd:UUID=0008-A438 inst.ks=hd:UUID=0008-A438:/w700/ks-silverblue.cfg quiet
	initrd /images/pxeboot/initrd.img
}
menuentry 'Install Fedora Silverblue 45 (W700) - basic graphics' --class fedora --class gnu-linux --class gnu --class os {
	linux /images/pxeboot/vmlinuz inst.stage2=hd:UUID=0008-A438 inst.ks=hd:UUID=0008-A438:/w700/ks-silverblue.cfg nomodeset
	initrd /images/pxeboot/initrd.img
}
submenu 'Other -->' {
	menuentry 'Plain Fedora 45 netinstall (choose any edition)' --class fedora --class gnu-linux --class gnu --class os {
		linux /images/pxeboot/vmlinuz inst.stage2=hd:UUID=0008-A438 quiet
		initrd /images/pxeboot/initrd.img
	}
	menuentry 'Rescue a Fedora system' --class fedora --class gnu-linux --class gnu --class os {
		linux /images/pxeboot/vmlinuz inst.stage2=hd:UUID=0008-A438 inst.rescue quiet
		initrd /images/pxeboot/initrd.img
	}
	menuentry 'UEFI firmware settings' {
		fwsetup
	}
}
