[package]
name = "tabpro-s-gnss"
version = "0.1.0"
edition = "2021"
description = "Runs Broadcom's BcmGnss.dll (GLL engine) natively on Linux for the BCM4752 GNSS receiver of the Samsung Galaxy TabPro S"
license = "GPL-2.0-or-later"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
debug = 1
panic = "abort"
