# DKMS (non-ostree distros): rebuilds automatically on kernel updates.
#   sudo cp -r camera/kernel /usr/src/tabpro-s-camera-1.0 && sudo dkms install tabpro-s-camera/1.0
# Fedora's dkms signs with /var/lib/dkms/mok.key (enroll /var/lib/dkms/mok.pub with mokutil once).
PACKAGE_NAME="tabpro-s-camera"
PACKAGE_VERSION="1.0"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
BUILT_MODULE_NAME[0]="intel_skl_int3472_tps68470"
BUILT_MODULE_LOCATION[0]="int3472/"
DEST_MODULE_LOCATION[0]="/updates/dkms"
BUILT_MODULE_NAME[1]="ipu-bridge"
BUILT_MODULE_LOCATION[1]="ipu-bridge/"
DEST_MODULE_LOCATION[1]="/updates/dkms"
BUILT_MODULE_NAME[2]="imx241"
BUILT_MODULE_LOCATION[2]="imx241/"
DEST_MODULE_LOCATION[2]="/updates/dkms"
BUILT_MODULE_NAME[3]="dw9806b"
BUILT_MODULE_LOCATION[3]="dw9806b/"
DEST_MODULE_LOCATION[3]="/updates/dkms"
AUTOINSTALL="yes"
