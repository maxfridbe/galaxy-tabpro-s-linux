# Samsung Galaxy TabPro S (SM-W700) camera: use locally built + MOK-signed modules
# (power-chip board data, ipu-bridge with INT347F). Built for one kernel version only:
# after a kernel update, rebuild: see docs/05-kernel-updates.md or the camera stays off.
install intel_skl_int3472_tps68470 /sbin/modprobe -q intel_skl_int3472_common; /sbin/modprobe -q clk-tps68470; /sbin/modprobe -q tps68470-regulator; /sbin/insmod /usr/local/lib/w700-camera/intel_skl_int3472_tps68470.ko || /sbin/modprobe --ignore-install intel_skl_int3472_tps68470
install ipu_bridge /sbin/insmod /usr/local/lib/w700-camera/ipu-bridge.ko || /sbin/modprobe --ignore-install ipu_bridge
